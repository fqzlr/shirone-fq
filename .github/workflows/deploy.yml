# 双仓部署：内容仓推送 -> 本仓库触发 EdgeOne Pages 部署钩子。
# 基于 deploy.yml.example 的变体 D：
#   EdgeOne 通过 Git 集成自建构建（克隆本仓库并执行 pnpm build），
#   因此本工作流只负责「触发」，构建与发布都在 EdgeOne 侧完成。
#
# 仓库 Secrets 需求：
#   DEPLOY_HOOK —— EdgeOne Pages 项目设置里创建的部署钩子 URL。
#   CONTENT_REPO_TOKEN —— 可读私有内容仓 fqzlr/shirone-content-fq 的
#   Fine-grained PAT（与 CI 用的同一 secret），用于核对内容 commit。
# EdgeOne 构建环境需配置：
#   CONTENT_REPO_URL=https://github.com/fqzlr/shirone-content-fq.git
#
# 注：不监听 push 事件——代码仓 push 已由 EdgeOne Git 集成自动触发构建，
# 这里再触发会造成同一 commit 重复构建。

name: Deploy

on:
  # 内容仓推送后由 trigger-build.yml 发来的事件。
  repository_dispatch:
    types: [content-updated]
  # 手动触发；回滚时把 content_ref 填成旧的内容 SHA。
  workflow_dispatch:
    inputs:
      content_ref:
        description: "内容仓 ref 或 commit SHA（留空使用 main）"
        required: false
        default: ""
  # 兜底：repository_dispatch 事件偶尔会丢，每天重建一次保证最终一致。
  schedule:
    - cron: "17 4 * * *"

# 并发控制：同一时间只允许一个部署流水线运行，
# 新的构建请求会自动取消正在运行中的旧触发，始终以最新内容为准。
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTENT_REPOSITORY: fqzlr/shirone-content-fq
  CONTENT_WORKING_COPY: .content-src

jobs:
  deploy:
    name: Trigger EdgeOne build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve content ref
        id: target
        # 经 env 传递而不是直接内插到脚本里：client_payload 属于外部输入，
        # 直接内插会形成 shell 注入面。
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_SHA:-}"
          [ -n "$ref" ] || ref="${INPUT_REF:-}"
          [ -n "$ref" ] || ref="main"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # 记录本次触发对应的内容 commit，便于在运行摘要里核对版本。
      # GITHUB_TOKEN 只有本仓库权限，读私有内容仓的 commits API 会 404，
      # 因此改用授权内容仓的 CONTENT_REPO_TOKEN；该步骤仅服务摘要核对，
      # 失败时回退为 unknown，不阻断部署。
      - name: Record content commit
        id: content
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          api="repos/${CONTENT_REPOSITORY}/commits/$(jq -rn --arg v '${{ steps.target.outputs.ref }}' '$v|@uri')"
          sha="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/$api" | jq -r .sha)"
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            sha="unknown"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────
      # 部署：触发 EdgeOne Pages 部署钩子，由平台自建构建。
      # EdgeOne 构建时通过 CONTENT_REPO_URL 拉取内容，content_ref 仅用于
      # 本工作流的核对摘要（平台侧始终构建默认分支）。
      # ─────────────────────────────────────────────────────────────────────
      - name: Trigger platform build
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 30 \
            --request POST "$DEPLOY_HOOK"

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Shirone deploy"
            echo ""
            echo "- 内容仓：\`${CONTENT_REPOSITORY}\`"
            echo "- 内容 ref：\`${{ steps.target.outputs.ref }}\`"
            echo "- 内容 commit：\`${{ steps.content.outputs.sha }}\`"
            echo "- 部署平台：EdgeOne Pages（Deploy Hook）"
          } >> "$GITHUB_STEP_SUMMARY"
